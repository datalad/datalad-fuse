# Read the Docs configuration
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    # fusepy, imported to document the FUSE file system class, needs libfuse2
    - libfuse2t64
  jobs:
    post_checkout:
      # versioneer derives the version from git tags
      - git fetch --unshallow --tags || true

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
